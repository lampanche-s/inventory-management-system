server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
spring.datasource.username=${DB_USERNAME:inventory_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app.security.login-rate-limit.window-ms=${LOGIN_RATE_LIMIT_WINDOW_MS:900000}
app.security.login-rate-limit.max-attempts-per-user=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_USER:10}
app.security.login-rate-limit.max-attempts-per-ip=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_IP:30}
app.security.login-rate-limit.max-tracked-keys=${LOGIN_RATE_LIMIT_MAX_TRACKED_KEYS:10000}

logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR
