server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: stockroom-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    login-rate-limit:
      window-ms: ${LOGIN_RATE_LIMIT_WINDOW_MS:900000}
      max-attempts-per-user: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_USER:10}
      max-attempts-per-ip: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_IP:30}
      max-tracked-keys: ${LOGIN_RATE_LIMIT_MAX_TRACKED_KEYS:10000}

logging:
  level:
    org.hibernate.SQL: error
    org.hibernate.orm.jdbc.bind: error
