spring:
  datasource:
    url: jdbc:h2:mem:stockroom_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: test-only-jwt-secret-with-at-least-thirty-two-bytes

logging:
  level:
    org.hibernate.SQL: error
    org.hibernate.orm.jdbc.bind: error
